<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Brycoin Network Platform</title>
    <!-- Socket.io Client Library Hook -->
    <script src="/socket.io/socket.io.js"></script>
    <style>
        /* Base Luxury Black & Gold Theme Styles */
        :root {
            --bg-color: #0a0a0a;
            --panel-bg: #121212;
            --gold-primary: #d4af37;
            --gold-hover: #f3e5ab;
            --text-color: #e0e0e0;
            --border-color: #333333;
            --error-color: #ff4d4d;
            --success-color: #4da6ff;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            padding-bottom: 60px;
        }

        /* Header & Navigation */
        header {
            background-color: var(--panel-bg);
            border-bottom: 2px solid var(--gold-primary);
            padding: 15px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo-container {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .logo-img {
            width: 40px;
            height: 40px;
            object-fit: contain;
            border: 1px solid var(--gold-primary);
            border-radius: 4px;
        }

        .logo-text {
            color: var(--gold-primary);
            font-size: 24px;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        nav {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
        }

        nav button {
            background: transparent;
            border: 1px solid var(--gold-primary);
            color: var(--gold-primary);
            padding: 8px 16px;
            cursor: pointer;
            font-weight: 600;
            text-transform: uppercase;
            font-size: 12px;
            transition: all 0.3s ease;
            border-radius: 4px;
        }

        nav button:hover, nav button.active {
            background-color: var(--gold-primary);
            color: var(--bg-color);
            box-shadow: 0 0 10px rgba(212, 175, 55, 0.3);
        }

        /* Main Workspace Container */
        .container {
            max-width: 1000px;
            margin: 40px auto;
            padding: 0 20px;
        }

        /* View Layout Component Panels */
        .view-panel {
            display: none;
            background-color: var(--panel-bg);
            border: 1px solid var(--gold-primary);
            border-radius: 8px;
            padding: 30px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.8);
        }

        .view-panel.active {
            display: block;
        }

        h2 {
            color: var(--gold-primary);
            margin-bottom: 25px;
            text-transform: uppercase;
            letter-spacing: 1px;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 10px;
        }

        /* System UI Forms */
        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: var(--gold-primary);
            font-size: 14px;
            font-weight: 600;
        }

        .form-group input, .form-group select {
            width: 100%;
            padding: 12px;
            background-color: var(--bg-color);
            border: 1px solid var(--border-color);
            color: var(--text-color);
            border-radius: 4px;
            font-size: 16px;
            transition: border-color 0.3s ease;
        }

        .form-group input:focus, .form-group select:focus {
            outline: none;
            border-color: var(--gold-primary);
        }

        .btn-submit {
            background-color: var(--gold-primary);
            color: var(--bg-color);
            border: none;
            padding: 12px 24px;
            font-size: 16px;
            font-weight: bold;
            text-transform: uppercase;
            cursor: pointer;
            border-radius: 4px;
            width: 100%;
            transition: background-color 0.3s ease;
        }

        .btn-submit:hover {
            background-color: var(--gold-hover);
        }

        /* System Utilities Alert Frameworks */
        .alert {
            padding: 12px;
            border-radius: 4px;
            margin-bottom: 20px;
            font-weight: 500;
            display: none;
        }

        .alert-error {
            background-color: rgba(255, 77, 77, 0.1);
            border: 1px solid var(--error-color);
            color: var(--error-color);
        }

        .alert-success {
            background-color: rgba(77, 166, 255, 0.1);
            border: 1px solid var(--success-color);
            color: var(--success-color);
        }

        /* User Identity Profile Sub-headers */
        .user-status-bar {
            background-color: #1a1a1a;
            border: 1px dashed var(--gold-primary);
            padding: 12px 20px;
            border-radius: 4px;
            margin-bottom: 25px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 14px;
        }

        .user-status-bar span b {
            color: var(--gold-primary);
        }

        /* Telemetry Stats Boards & Lists */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 11fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            background-color: var(--bg-color);
            border: 1px solid var(--border-color);
            padding: 20px;
            border-radius: 4px;
            text-align: center;
        }

        .stat-card h3 {
            font-size: 14px;
            color: #888;
            text-transform: uppercase;
            margin-bottom: 10px;
        }

        .stat-card p {
            font-size: 22px;
            color: var(--gold-primary);
            font-weight: bold;
        }

        /* Data Tables for Ledgers & Rankings */
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
        }

        th, td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid var(--border-color);
        }

        th {
            color: var(--gold-primary);
            text-transform: uppercase;
            font-size: 13px;
            letter-spacing: 0.5px;
        }

        tr:hover {
            background-color: rgba(255, 255, 255, 0.02);
        }

        /* Integrated Mining Interface Elements */
        .miner-dashboard {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        @media (max-width: 768px) {
            .miner-dashboard {
                grid-template-columns: 1fr;
            }
        }

        .miner-console {
            background-color: #000000;
            border: 1px solid #222;
            font-family: 'Courier New', Courier, monospace;
            padding: 15px;
            height: 250px;
            overflow-y: auto;
            color: #00ff00;
            font-size: 13px;
            border-radius: 4px;
        }

        .miner-controls {
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .btn-mine-start {
            background-color: #2e7d32;
            color: #fff;
        }
        .btn-mine-start:hover { background-color: #388e3c; }

        .btn-mine-stop {
            background-color: #c62828;
            color: #fff;
        }
        .btn-mine-stop:hover { background-color: #d32f2f; }

        .mining-active-status {
            color: var(--error-color);
            font-weight: bold;
            animation: pulse 1.5s infinite alternate;
        }

        @keyframes pulse {
            from { opacity: 0.4; }
            to { opacity: 1; }
        }
    </style>
</head>
<body>

    <!-- Header Frame containing Brand Assets and Navigation Control Anchors -->
    <header>
        <div class="logo-container">
            <img src="/static/image.png" alt="Brycoin Logo" class="logo-img" onerror="this.style.display='none'">
            <div class="logo-text">Brycoin</div>
        </div>
        <nav id="navigation-bar">
            <button onclick="switchView('login')" id="nav-login">Login</button>
            <button onclick="switchView('register')" id="nav-register">Register KYC</button>
            <button onclick="switchView('miner')" id="nav-miner" style="display:none;">Miner Deck</button>
            <button onclick="switchView('wallet')" id="nav-wallet" style="display:none;">Wallet Hub</button>
            <button onclick="switchView('stats')" id="nav-stats" style="display:none;">Network Stats</button>
            <button onclick="switchView('explorer')" id="nav-explorer" style="display:none;">Compliance Explorer</button>
            <button onclick="switchView('admin')" id="nav-admin" style="display:none;">Admin Core</button>
            <button onclick="executeLogout()" id="nav-logout" style="display:none;">Sign Out</button>
        </nav>
    </header>

    <div class="container">
        <!-- Global Feedback Message Elements -->
        <div id="global-alert-error" class="alert alert-error"></div>
        <div id="global-alert-success" class="alert alert-success"></div>

        <!-- System User Security Information Card -->
        <div id="user-status-card" class="user-status-bar" style="display:none;">
